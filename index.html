.wrap{max-width:1180px;margin:auto;padding:0 24px}
header{position:fixed;inset:0 0 auto;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--rust)}
.logo .mark{width:38px;height:38px}.logo b{font:400 28px/1 'Bebas Neue';color:var(--tan);letter-spacing:.04em}
[lang=ar] .logo b{font:900 20px Cairo}
nav{display:flex;gap:26px;font-size:14px}nav a{text-decoration:none}nav a:hover{color:var(--rust)}
.lang{border:1.5px solid var(--rust);background:none;color:var(--rust);border-radius:99px;padding:6px 16px;font:600 14px Cairo,Montserrat;cursor:pointer}
.lang:hover{background:var(--rust);color:var(--cream)}
@media(max-width:820px){nav{display:none}}
.hero{padding:110px 0 30px}.hero .top{display:grid;grid-template-columns:1.35fr .65fr;gap:40px;align-items:end;margin-bottom:36px}.hero .top p{margin:0 0 22px}.blob.wide{animation:none;border-radius:44px 44px 44px 200px;aspect-ratio:21/9;max-height:64vh;width:100%}
.hero h1{font-size:clamp(54px,8.4vw,118px);color:var(--rust)}
[lang=ar] .hero h1{font-size:clamp(42px,6.4vw,84px)}
.hero p{max-width:46ch;margin:22px 0 32px;opacity:.85}
.btn{display:inline-block;padding:14px 30px;border-radius:99px;background:var(--rust);color:var(--cream);text-decoration:none;font-weight:600;font-size:15px;border:0;cursor:pointer;font-family:inherit}
.btn.o{background:none;color:var(--rust);border:1.5px solid var(--rust);margin-inline-start:10px}
.btn:hover{filter:brightness(1.12)}
.blob{border-radius:var(--blob);overflow:hidden;aspect-ratio:1/1.05;background:var(--tan);animation:morph 14s ease-in-out infinite alternate}
.blob img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes morph{to{border-radius:44% 56% 42% 58%/56% 44% 58% 42%}}
@media(max-width:820px){.hero{padding-top:96px}.hero .top{grid-template-columns:1fr}.blob.wide{aspect-ratio:4/3;border-radius:32px 32px 32px 110px}}
.duo{position:relative;padding-bottom:80px}.duo .blob{width:76%}.duo .b2{position:absolute;inset-inline-end:0;bottom:0;width:46%;aspect-ratio:3/4;object-fit:cover;border:8px solid var(--bg);border-radius:40px 40px 140px 40px;z-index:2}
.cta{text-align:center;padding:110px 0}.cta h2{max-width:16ch;margin-inline:auto}.big{display:inline-block;font:400 clamp(60px,11vw,160px)/1 'Bebas Neue';color:var(--tan);text-decoration:none;border-bottom:4px solid var(--tan)}[lang=ar] .big{font:900 clamp(44px,8vw,110px)/1.3 Cairo}.big:hover{color:var(--rust);border-color:var(--rust)}
section{padding:96px 0}
h2{font-size:clamp(40px,5vw,66px);color:var(--rust);margin-bottom:20px}[lang=ar] h2{font-size:clamp(32px,4vw,52px)}
.about .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.about .blob{border-radius:42% 58% 40% 60%/55% 42% 58% 45%;animation:none;aspect-ratio:1/1.1}
.stats{display:flex;gap:40px;margin-top:28px;flex-wrap:wrap}.stats b{display:block;font:400 54px/1 'Bebas Neue';color:var(--tan)}[lang=ar] .stats b{font:900 40px Cairo}.stats span{font-size:14px;opacity:.75}
@media(max-width:820px){.about .wrap{grid-template-columns:1fr}}
.services{background:var(--rust);color:var(--cream)}.services h2{color:var(--cream)}
.sgrid{display:grid;margin-top:40px}.s{display:grid;grid-template-columns:70px 1fr 1.2fr;gap:24px;align-items:center;padding:28px 0;border-top:1.5px solid rgba(240,232,222,.3)}.s h3{font-size:46px!important;margin:0!important}[lang=ar] .s h3{font-size:30px!important}
.s .mark{width:44px;height:44px;color:var(--tan);margin-bottom:16px;opacity:.9}
.s h3{font-size:34px;margin-bottom:10px}[lang=ar] .s h3{font-size:24px}.s p{font-size:15px;opacity:.85;margin:0}
@media(max-width:700px){.s{grid-template-columns:50px 1fr}.s p{grid-column:2}}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 34px}
.filters button{border:1.5px solid var(--tan);background:none;color:var(--tx);border-radius:99px;padding:8px 20px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--tan);color:var(--ink)}
.grid{columns:2 340px;column-gap:22px}
.card{break-inside:avoid;margin:0 0 18px;position:relative;cursor:pointer;border:0;padding:0;background:none;width:100%;display:block;text-align:start;color:inherit;font:inherit}
.card .m{display:block;overflow:hidden;border-radius:26px 26px 90px 26px;background:var(--tan)}
.card:nth-child(even) .m{border-radius:90px 26px 26px 26px}
.card img,.card .art{width:100%;display:block;transition:transform .6s}.card:hover img{transform:scale(1.05)}
.art{aspect-ratio:4/5;position:relative}
.art::before{content:"";position:absolute;inset:auto 18% 0;height:58%;border-radius:999px 999px 0 0;background:var(--c2);box-shadow:0 0 0 18px var(--c3) inset}
.play{position:absolute;inset-inline-end:16px;top:16px;width:46px;height:46px;border-radius:50%;background:var(--cream);color:var(--rust);display:grid;place-items:center;font-size:16px}
.card figcaption,.card .cap{padding:12px 6px 0;font-size:14px}.cap b{display:block;font:400 26px/1.1 'Bebas Neue';letter-spacing:.03em;color:var(--rust)}[lang=ar] .cap b{font:700 18px Cairo}
.process{background:color-mix(in srgb,var(--tan) 22%,var(--bg))}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:36px;counter-reset:s}
.step{border-top:3px solid var(--rust);padding-top:16px;counter-increment:s}.step::before{content:counter(s,decimal-leading-zero);font:400 40px/1 'Bebas Neue';color:var(--tan)}
.step h3{font-size:30px;margin:6px 0}[lang=ar] .step h3{font-size:22px}.step p{font-size:15px;margin:0;opacity:.85}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:520px){.steps{grid-template-columns:1fr}}
.contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.contact ul{list-style:none;padding:0;margin:26px 0}.contact li{margin-bottom:14px}.contact li small{display:block;color:var(--tan);font-weight:600}
form{display:grid;gap:14px}input,textarea{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--tan);background:transparent;color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical}
@media(max-width:820px){.contact .wrap{grid-template-columns:1fr}}
footer{background:var(--ink);color:var(--cream);padding:40px 0;font-size:14px}footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}footer .mark{width:44px;height:44px;color:var(--tan)}
dialog{border:0;border-radius:28px;padding:0;max-width:min(920px,94vw);background:var(--bg);color:var(--tx)}dialog::backdrop{background:rgba(30,15,10,.78)}
dialog img,dialog video{display:block;width:100%;max-height:78vh;object-fit:contain;background:#000}dialog .art{max-height:70vh}
dialog .cap{padding:16px 22px}dialog form{display:block;position:absolute;top:10px;inset-inline-end:10px}
dialog button{border:0;background:var(--cream);color:var(--rust);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}

/* MOTION */
#bar{position:fixed;inset:0 0 auto;height:3px;background:var(--tan);transform:scaleX(0);transform-origin:left;z-index:30}[dir=rtl] #bar{transform-origin:right}
header{transition:transform .45s cubic-bezier(.2,.7,.2,1)}header.hide{transform:translateY(-100%)}
.logo .mark{transition:transform .8s cubic-bezier(.2,.7,.2,1)}.logo:hover .mark{transform:rotate(-12deg) scale(1.12)}
@keyframes rise{from{opacity:0;transform:translateY(64px)}}
@keyframes unmask{from{clip-path:inset(0 0 100% 0 round 44px);transform:scale(1.06)}to{clip-path:inset(0 0 0 0 round 44px);transform:none}}
.hero h1{animation:rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both}.hero .top>div{animation:rise 1s .5s cubic-bezier(.2,.7,.2,1) both}
.hero .blob.wide{animation:unmask 1.7s .35s cubic-bezier(.7,0,.2,1) both}
.hero .wide img{transform:translateY(var(--py,0px)) scale(1.2)}.duo .blob img{transform:translateY(var(--py,0px)) scale(1.15)}.duo .b2{transform:translateY(var(--py,0px))}
.rv{opacity:0;transform:translateY(36px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.card .m{clip-path:inset(0);transition:clip-path 1.2s cubic-bezier(.7,0,.2,1)}.card.rv:not(.in) .m{clip-path:inset(100% 0 0 0)}
.marq{direction:ltr;overflow:hidden;background:var(--rust);color:var(--cream);padding:20px 0;transform:rotate(-1.4deg);margin:34px -20px}
.marq #mq{display:flex;align-items:center;gap:36px;width:max-content;animation:mq 30s linear infinite}.marq:hover #mq{animation-play-state:paused}
.marq span{font:400 38px/1 'Bebas Neue';letter-spacing:.04em;white-space:nowrap}[lang=ar] .marq span{font:900 26px/1.3 Cairo}.marq i{width:30px;height:30px;color:var(--tan);flex:none}
@keyframes mq{to{transform:translateX(-50%)}}
.s{position:relative}.s::after{content:"";position:absolute;inset:auto 0 -1.5px;height:2px;background:var(--tan);transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}[dir=rtl] .s::after{transform-origin:right}.s:hover::after{transform:scaleX(1)}
.s h3{transition:transform .5s cubic-bezier(.2,.7,.2,1)}.s:hover h3{transform:translateX(16px)}[dir=rtl] .s:hover h3{transform:translateX(-16px)}
.s .mark{transition:transform .7s cubic-bezier(.2,.7,.2,1)}.s:hover .mark{transform:rotate(14deg) scale(1.15)}

let L=localStorage.getItem?'en':'en',F='all';
try{L=localStorage.getItem('cl')||'en'}catch(e){}
const $=s=>document.querySelector(s);
function art(p){return `<span class="art" style="background:${p.c1};--c2:${p.c2};--c3:${p.c3}"></span>`}
function media(p,big){if(p.src&&p.type==='video')return `<video ${big?'controls autoplay':'muted loop playsinline'} src="${p.src}" ${p.poster?`poster="${p.poster}"`:''}></video>`;return p.src?`<img alt="${p.t[L]}" src="${p.src}" loading="lazy">`:art(p)}
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[L][e.dataset.i]);
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T[L][e.dataset.ph]);
 $('#lang').textContent=L==='ar'?'EN':'عربي';
 const fl=[['all',T[L].all],['res',T[L].res],['com',T[L].com],['out',T[L].out],['video',T[L].film]];
 $('#filters').innerHTML=fl.map(([k,v])=>`<button aria-pressed="${F===k}" data-f="${k}">${v}</button>`).join('');
 $('#grid').innerHTML=P.map((p,i)=>({p,i})).filter(({p})=>F==='all'||p.c===F||(F==='video'&&p.type==='video')).map(({p,i})=>
 `<button class="card" data-k="${i}"><span class="m" style="display:block;position:relative">${media(p)}${p.type==='video'?'<span class="play">▶</span>':''}</span><span class="cap"><b>${p.t[L]}</b></span></button>`).join('');
}
document.addEventListener('click',e=>{
 const f=e.target.closest('[data-f]');if(f){F=f.dataset.f;render();return}
 const c=e.target.closest('[data-k]');if(c){const p=P[c.dataset.k];$('#dbody').innerHTML=media(p,1)+`<div class="cap"><b>${p.t[L]}</b></div>`;$('#dlg').showModal()}
 if(e.target===$('#dlg')){$('#dlg').close()}
});
$('#dlg').addEventListener('close',()=>$('#dbody').innerHTML='');
$('#lang').onclick=()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('cl',L)}catch(e){}render()};
$('#form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);location.href='mailto:caveman.decorations@gmail.com?subject='+encodeURIComponent('Project enquiry – '+d.get('n'))+'&body='+encodeURIComponent(d.get('m')+'\n\n'+d.get('n')+'\n'+d.get('p')+'\n'+d.get('e'))};
$('#b2').src=P[4].src;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target.matches('.stats'))count(e.target);io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
function count(s){s.querySelectorAll('b').forEach(b=>{if(RM)return;const f=b.dataset.f,n=parseInt(f),suf=f.replace(/\d+/,''),t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1700);b.textContent=Math.round(n*(1-Math.pow(1-k,3)))+suf;if(k<1)requestAnimationFrame(s)})(t0)})}
function reveal(){document.querySelectorAll('h2,.duo,.about p,.stats,.s,.step,.card,.filters,.contact .wrap>*,.cta .big').forEach(el=>{if(el.dataset.rv)return;el.dataset.rv=1;el.classList.add('rv');
 el.style.transitionDelay=Math.min([...el.parentNode.children].indexOf(el),6)*90+'ms';
 if(el.matches('.stats'))el.querySelectorAll('b').forEach(b=>{b.dataset.f=b.textContent;if(!RM)b.textContent='0'+b.textContent.replace(/\d+/,'')});
 RM?el.classList.add('in'):io.observe(el)})}
function marquee(){const r=[T[L].v1,T[L].v2,T[L].v3,T[L].v4].map(x=>`<span>${x}</span><i class="mark"></i>`).join('');$('#mq').innerHTML=r.repeat(4)}
const baseRender=render;render=function(){baseRender();marquee();reveal()};
document.querySelector('.hero .wide img').dataset.px=-.08;document.querySelector('.duo .blob img').dataset.px=-.06;$('#b2').dataset.px=.1;
let tk=0,ly=0;
function px(){tk=0;document.querySelectorAll('[data-px]').forEach(el=>{const r=el.parentElement.getBoundingClientRect();if(r.bottom<-300||r.top>innerHeight+300)return;el.style.setProperty('--py',((r.top+r.height/2-innerHeight/2)*el.dataset.px).toFixed(1)+'px')})}
addEventListener('scroll',()=>{const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;$('#bar').style.transform=`scaleX(${h>0?y/h:0})`;$('header').classList.toggle('hide',y>ly&&y>240);ly=y;if(!tk&&!RM)tk=requestAnimationFrame(px)},{passive:true});
$('#lang').onclick=()=>{document.body.style.transition='opacity .22s';document.body.style.opacity=0;setTimeout(()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('cl',L)}catch(e){}render();px();document.body.style.opacity=1},220)};
render();px();
</script>
</body>
</html>
